<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マイセトリ帳</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1c1c1e;
    --sub-text: #6e6e73;
    --accent: #ff375f;
    --border: #e5e5ea;
    --ok: #34c759;
    --warn: #ff9500;
    --err: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --text: #f2f2f7;
      --sub-text: #98989d;
      --border: #38383a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: calc(16px + env(safe-area-inset-top)) 16px 8px;
  }
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 22px;
    margin: 0;
  }
  .icon-btn {
    background: none;
    border: none;
    font-size: 20px;
    padding: 4px 8px;
  }
  .sync-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .sync-status {
    font-size: 12px;
    color: var(--sub-text);
    flex: 1;
  }
  .sync-status.ok { color: var(--ok); }
  .sync-status.warn { color: var(--warn); }
  .sync-status.err { color: var(--err); }
  .sync-now-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 0;
  }
  .tabs {
    display: flex;
    gap: 8px;
    background: var(--card-bg);
    border-radius: 10px;
    padding: 4px;
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--sub-text);
    padding: 8px 0;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
  }
  main {
    padding: 8px 16px;
    max-width: 640px;
    margin: 0 auto;
  }
  .search-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 15px;
    margin-bottom: 12px;
  }
  .empty {
    color: var(--sub-text);
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.6;
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 14px;
    cursor: pointer;
  }
  .card-head .info { flex: 1; min-width: 0; }
  .card-artist {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-meta {
    font-size: 13px;
    color: var(--sub-text);
    margin-top: 2px;
  }
  .chevron {
    color: var(--sub-text);
    transition: transform 0.15s ease;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .card.open .chevron { transform: rotate(90deg); }
  .card-body {
    display: none;
    padding: 0 14px 14px;
  }
  .card.open .card-body { display: block; }
  .song-list {
    margin: 0;
    padding-left: 22px;
    font-size: 14px;
    line-height: 1.9;
  }
  .card-actions {
    display: flex;
    gap: 16px;
    margin-top: 10px;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    padding: 4px 0;
  }
  .link-btn.muted { color: var(--sub-text); }
  .ref-link {
    display: inline-block;
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 8px;
    text-decoration: none;
  }
  .song-count-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 9px;
    margin-left: 8px;
  }
  .song-row {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .song-row-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .song-name { font-size: 15px; font-weight: 600; }
  .song-detail {
    display: none;
    margin-top: 8px;
    font-size: 13px;
    color: var(--sub-text);
  }
  .song-row.open .song-detail { display: block; }
  .song-detail div { padding: 3px 0; }
  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 28px;
    border: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    z-index: 20;
  }
  .footer-actions {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 20px 0 8px;
  }
  .footer-actions button {
    background: none;
    border: none;
    color: var(--sub-text);
    font-size: 13px;
    text-decoration: underline;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 30;
    align-items: flex-end;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg);
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
  }
  .modal h2 {
    font-size: 18px;
    margin: 0 0 16px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--sub-text);
    margin-bottom: 4px;
  }
  .field input, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  .field textarea {
    min-height: 140px;
    resize: vertical;
    line-height: 1.7;
  }
  .field-hint {
    font-size: 12px;
    color: var(--sub-text);
    margin-top: 4px;
  }
  .modal-error {
    display: none;
    background: rgba(255, 59, 48, 0.12);
    color: var(--err);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .modal-error.show { display: block; }
  .modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .btn {
    flex: 1;
    padding: 13px 0;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: 0.5; }
  .btn-secondary { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); }
  input[type="file"] { display: none; }

  /* --- Spotify連携 --- */
  .art {
    width: 34px;
    height: 34px;
    border-radius: 5px;
    flex-shrink: 0;
    background: var(--border);
    object-fit: cover;
    display: inline-block;
  }
  .song-list {
    list-style: none;
    padding-left: 0;
    line-height: 1.5;
  }
  .song-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 3px 0;
  }
  .song-list .num {
    width: 18px;
    flex-shrink: 0;
    text-align: right;
    font-size: 12px;
    color: var(--sub-text);
  }
  .song-list .nm {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .song-row-head .art { margin-right: 10px; }
  .song-row-head .song-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sp-section {
    border-top: 1px solid var(--border);
    margin-top: 18px;
    padding-top: 14px;
  }
  .sp-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sp-state {
    flex: 1;
    font-size: 13px;
    color: var(--sub-text);
  }
  .sp-state.ok { color: var(--ok); }
  .btn-sp {
    background: #1db954;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn-sp.secondary {
    background: transparent;
    color: var(--sub-text);
    border: 1px solid var(--border);
  }
  .sp-results {
    display: none;
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    overflow: hidden;
  }
  .sp-results.show { display: block; }
  .sp-result {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border: none;
    border-bottom: 1px solid var(--border);
    background: none;
    color: var(--text);
    font-family: inherit;
    text-align: left;
    cursor: pointer;
  }
  .sp-result:last-child { border-bottom: none; }
  .sp-result img { width: 38px; height: 38px; border-radius: 5px; flex-shrink: 0; object-fit: cover; }
  .sp-result .t { flex: 1; min-width: 0; }
  .sp-result .t b {
    display: block;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sp-result .t span {
    display: block;
    font-size: 12px;
    color: var(--sub-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sp-note {
    font-size: 12px;
    color: var(--sub-text);
    margin-top: 6px;
    min-height: 16px;
  }

  /* --- 絞り込み --- */
  .field select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  .filter-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }
  .filter-row select {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .filter-clear {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    padding: 4px 2px;
  }
  .filter-count {
    font-size: 12px;
    color: var(--sub-text);
    margin-bottom: 8px;
    min-height: 15px;
  }
  .attribution {
    font-size: 11px;
    color: var(--sub-text);
    text-align: center;
    padding: 0 0 12px;
    line-height: 1.6;
  }
  .attribution a { color: var(--sub-text); }
  .btn-sl {
    width: 100%;
    background: var(--card-bg);
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 0;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
  }
  .btn-sl:disabled { opacity: 0.5; }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--sub-text);
    margin-bottom: 8px;
  }
  .card-pref {
    display: inline-block;
    font-size: 11px;
    color: var(--sub-text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 5px;
    margin-left: 6px;
    vertical-align: 1px;
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>マイセトリ帳</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙️</button>
  </div>
  <div class="sync-row">
    <span class="sync-status" id="syncStatus">未設定</span>
    <button class="sync-now-btn" id="syncNowBtn">🔄 同期</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="lives">ライブ一覧</button>
    <button class="tab-btn" data-tab="songs">全曲一覧</button>
  </div>
</header>

<main>
  <section id="tab-lives">
    <input type="text" id="searchInput" class="search-input" placeholder="アーティスト・会場・日付（2026-05 など）で検索">
    <div class="filter-row">
      <select id="filterPref"></select>
      <select id="filterYear"></select>
      <button type="button" class="filter-clear" id="filterClear">クリア</button>
    </div>
    <div class="filter-count" id="filterCount"></div>
    <div id="livesList"></div>
  </section>

  <section id="tab-songs" style="display:none;">
    <div id="songsList"></div>
  </section>

  <div class="footer-actions">
    <button id="exportBtn">バックアップを書き出す</button>
    <button id="importBtn">バックアップを読み込む</button>
    <input type="file" id="importFile" accept="application/json">
  </div>
  <div class="attribution">
    公演情報・セトリの一部は <a href="https://www.setlist.fm/" target="_blank" rel="noopener">setlist.fm</a> から取得しています。
  </div>
</main>

<button class="fab" id="addFab">＋</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">ライブを追加</h2>
    <form id="liveForm">
      <input type="hidden" id="editId">
      <div class="field">
        <label>アーティスト名 *</label>
        <input type="text" id="fArtist" required autocomplete="off">
        <div class="sp-results" id="spArtistResults"></div>
        <div class="sp-note" id="spArtistNote"></div>
      </div>
      <div class="field">
        <label>ライブ名・ツアー名</label>
        <input type="text" id="fTitle" placeholder="例: THE FIRST TAKE STAGE">
      </div>
      <div class="field">
        <label>日付 *</label>
        <input type="date" id="fDate" required>
      </div>
      <div class="field">
        <label>会場</label>
        <input type="text" id="fVenue" placeholder="例: 東京ドーム">
      </div>
      <div class="field">
        <label>都道府県</label>
        <select id="fPref"></select>
        <div class="field-hint" id="fPrefHint">会場名から自動で候補を入れます。違っていれば選び直してください。</div>
      </div>
      <div class="field">
        <button type="button" class="btn-sl" id="slFetchBtn">📅 この日付の公演を探して自動入力</button>
        <div class="sp-results" id="slResults"></div>
        <div class="sp-note" id="slNote"></div>
      </div>
      <div class="field">
        <label>参考リンク（livefans.jp のページなど）</label>
        <input type="url" id="fUrl" placeholder="https://www.livefans.jp/...">
        <div class="field-hint">livefans.jpでセトリを確認しながら、下の欄に自分で入力してください</div>
      </div>
      <div class="field">
        <label>Spotifyで曲を探して追加</label>
        <input type="text" id="spQuery" placeholder="曲名を入力すると候補が出ます" autocomplete="off">
        <div class="sp-results" id="spResults"></div>
        <div class="sp-note" id="spNote"></div>
      </div>
      <div class="field">
        <label>セトリ（1行に1曲）</label>
        <textarea id="fSongs" placeholder="曲名1&#10;曲名2&#10;曲名3"></textarea>
      </div>
      <div class="modal-buttons">
        <button type="button" class="btn btn-secondary" id="cancelBtn">キャンセル</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <h2>GitHub連携設定</h2>
    <div class="modal-error" id="settingsError"></div>
    <div class="field">
      <label>GitHubユーザー名</label>
      <input type="text" id="ghOwner" placeholder="例: haruto-hironaka">
    </div>
    <div class="field">
      <label>リポジトリ名</label>
      <input type="text" id="ghRepo" placeholder="例: setlist-data">
    </div>
    <div class="field">
      <label>Personal Access Token</label>
      <input type="password" id="ghToken" placeholder="github_pat_...">
      <div class="field-hint">この端末のブラウザ内にのみ保存されます。他の端末にも同じ設定を入力してください。</div>
    </div>
    <div class="modal-buttons">
      <button type="button" class="btn btn-secondary" id="settingsCancelBtn">キャンセル</button>
      <button type="button" class="btn btn-primary" id="settingsSaveBtn">保存して接続確認</button>
    </div>
    <div class="sp-section">
      <label style="display:block;font-size:13px;color:var(--sub-text);margin-bottom:6px;">Spotify連携</label>
      <div class="sp-row">
        <span class="sp-state" id="spState">未接続</span>
        <button type="button" class="btn-sp" id="spConnectBtn">接続する</button>
        <button type="button" class="btn-sp secondary" id="spDisconnectBtn" style="display:none;">解除</button>
      </div>
      <div class="field-hint">接続すると、曲名の検索候補とアルバムアートが使えます。上のGitHub設定とは独立していて、「保存して接続確認」を押す必要はありません。</div>
    </div>
  </div>
</div>

<script>
(function () {
  const LOCAL_CACHE_KEY = 'setlistApp.concerts';
  const GH_CONFIG_KEY = 'setlistApp.github.config';
  const DATA_PATH = 'data.json';

  function loadLocalCache() {
    try {
      const raw = localStorage.getItem(LOCAL_CACHE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveLocalCache(data) {
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(data));
  }

  function loadGithubConfig() {
    try {
      const raw = localStorage.getItem(GH_CONFIG_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function saveGithubConfig(cfg) {
    localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
  }

  function b64EncodeUnicode(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
  }

  function b64DecodeUnicode(str) {
    return decodeURIComponent(atob(str.replace(/\n/g, '')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  }

  // ---------- 都道府県 ----------
  const PREFS = [
    '北海道', '青森県', '岩手県', '宮城県', '秋田県', '山形県', '福島県',
    '茨城県', '栃木県', '群馬県', '埼玉県', '千葉県', '東京都', '神奈川県',
    '新潟県', '富山県', '石川県', '福井県', '山梨県', '長野県',
    '岐阜県', '静岡県', '愛知県', '三重県',
    '滋賀県', '京都府', '大阪府', '兵庫県', '奈良県', '和歌山県',
    '鳥取県', '島根県', '岡山県', '広島県', '山口県',
    '徳島県', '香川県', '愛媛県', '高知県',
    '福岡県', '佐賀県', '長崎県', '熊本県', '大分県', '宮崎県', '鹿児島県', '沖縄県'
  ];

  // 会場名から都道府県を推定するための対応表。あくまで初期値の提案で、確定情報ではない。
  // 上から順に部分一致で判定するので、紛らわしい語（東京→京都）は先に置く必要がある。
  const VENUE_HINTS = [

  // setlist.fmは長音記号付きで返すことがある（兵庫→Hyōgo、大阪→Ōsaka）。
  // 比較前に記号を落として揃える。
  function normLatin(s) {
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  const EN_TO_PREF = Object.fromEntries(Object.entries(PREF_EN).map(([ja, en]) => [normLatin(en), ja]));

  // setlist.fmの日付形式は dd-MM-yyyy
  function toSetlistFmDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    return m ? `${m[3]}-${m[2]}-${m[1]}` : '';
  }

  function normalizeSetlistEntry(entry) {
    // APIは sets.set[].song[] の形。念のため set[] 直置きにも対応する
    const raw = (entry.sets && entry.sets.set) || entry.set || [];
    const groups = Array.isArray(raw) ? raw : [];
    const songs = [];
    groups.forEach(g => {
      (g.song || []).forEach(s => {
        if (s && s.name) songs.push(s.name);
      });
    });
    const city = (entry.venue && entry.venue.city) || {};
    return {
      artist: (entry.artist && entry.artist.name) || '',
      venue: (entry.venue && entry.venue.name) || '',
      city: city.name || '',
      state: city.state || '',
      tour: (entry.tour && entry.tour.name) || '',
      url: entry.url || '',
      songs
    };

  const SL_MIN_GAP_MS = 1100;
  let slLastCallAt = 0;

  async function slWaitForSlot() {
    const wait = slLastCallAt + SL_MIN_GAP_MS - Date.now();
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    slLastCallAt = Date.now();
  }

  async function fetchSetlistPage(isoDate, page, isRetry) {
    await slWaitForSlot();
    const date = toSetlistFmDate(isoDate);
    const url = `${SETLIST_PROXY}?${new URLSearchParams({ date, countryCode: 'JP', p: String(page) })}`;
    const res = await fetch(url);
    // 中継サーバーは該当なしを 200 + 空配列で返す設計なので、404はURLの設定ミス
    if (res.status === 404) {
      throw new Error('中継サーバーが見つかりません(404)。設定したURLを確認してください。');
    }
    // レート制限。一度だけ間を置いて再挑戦する
    if (res.status === 429) {
      if (isRetry) {
        throw new Error('アクセスが混み合っています。10秒ほど待ってからもう一度お試しください。');
      }
      const retryAfter = parseInt(res.headers.get('Retry-After') || '', 10);
      const waitMs = Number.isFinite(retryAfter) ? (retryAfter + 1) * 1000 : 4000;
      await new Promise(r => setTimeout(r, waitMs));
      return await fetchSetlistPage(isoDate, page, true);
    }
    if (!res.ok) {
      let detail = '';
      try {
        const body = await res.json();
        if (body && body.error) detail = `：${body.error}`;
      } catch (e) { /* JSON以外は無視 */ }
      throw new Error(`公演情報の取得に失敗しました(${res.status})${detail}`);
    }
    return await res.json();
  }

  // その日の日本国内の公演を取得し、選択中の都道府県のものを先頭に並べる。
  // 都道府県で絞り込まず並べ替えるだけにしてあるのは、英語名の対応が外れても候補が消えないようにするため。
  // 1日に100件以上あることも珍しくないため、選んだ都道府県の分が十分集まるまでページを追う。
  // 1日あたりのAPI上限(1440件)を食い潰さないよう、ページ数には上限を設ける。
  const SL_MAX_PAGES = 5;
  const SL_ENOUGH_MATCHES = 8;

  async function searchSetlistsByDate(isoDate, prefJa, onProgress) {
    const wanted = normLatin(PREF_EN[prefJa] || '');
    let entries = [];
    let total = 0;

    for (let page = 1; page <= SL_MAX_PAGES; page++) {
      if (page > 1 && onProgress) {
        onProgress(`この日は${total}件あります。絞り込み中...（${page}ページ目）`);
      }
      const data = await fetchSetlistPage(isoDate, page);
      const batch = (data.setlist || []).map(normalizeSetlistEntry);
      total = data.total || entries.length + batch.length;
      entries = entries.concat(batch);

      if (!batch.length || entries.length >= total) break;
      // 都道府県を選んでいるなら、その分が十分集まった時点で打ち切る
      if (wanted && entries.filter(e => normLatin(e.state) === wanted).length >= SL_ENOUGH_MATCHES) break;
      // 選んでいない場合は無限に追う意味がないので2ページで止める
      if (!wanted && page >= 2) break;
    }

    const matched = wanted ? entries.filter(e => normLatin(e.state) === wanted) : [];
    const rest = wanted ? entries.filter(e => normLatin(e.state) !== wanted) : entries;
    return { entries: matched.concat(rest), matchedCount: matched.length, total };
  }

  // Spotifyに登録したRedirect URIと完全一致させる（index.html付きで開かれた場合も揃える）
  function spRedirectUri() {

  function randomString(len) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    const bytes = new Uint8Array(len);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, b => chars[b % chars.length]).join('');
  }

  function base64Url(buf) {
    return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  async function spStartAuth() {
    const verifier = randomString(64);
    localStorage.setItem(SP_VERIFIER_KEY, verifier);
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    const params = new URLSearchParams({
      client_id: SP_CLIENT_ID,
      response_type: 'code',
      redirect_uri: spRedirectUri(),
      code_challenge_method: 'S256',
      code_challenge: base64Url(digest)
    });
    location.href = `https://accounts.spotify.com/authorize?${params}`;
  }

  async function spExchangeCode(code) {
    const verifier = localStorage.getItem(SP_VERIFIER_KEY);
    if (!verifier) throw new Error('認証情報が見つかりませんでした。もう一度接続してください。');
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code',
        code,
        redirect_uri: spRedirectUri(),
        client_id: SP_CLIENT_ID,
        code_verifier: verifier
      })
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error_description || body.error || `トークン取得に失敗(${res.status})`);
    localStorage.removeItem(SP_VERIFIER_KEY);
    spToken = {
      access: body.access_token,
      refresh: body.refresh_token,
      expiresAt: Date.now() + (body.expires_in - 60) * 1000
    };
    localStorage.setItem(SP_TOKEN_KEY, JSON.stringify(spToken));
  }

  async function spRefresh() {
    if (!spToken || !spToken.refresh) return null;
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'refresh_token',
        refresh_token: spToken.refresh,
        client_id: SP_CLIENT_ID
      })
    });
    if (!res.ok) {
      spToken = null;
      localStorage.removeItem(SP_TOKEN_KEY);
      updateSpotifyUi();
      return null;
    }
    const body = await res.json();
    spToken = {
      access: body.access_token,
      refresh: body.refresh_token || spToken.refresh,
      expiresAt: Date.now() + (body.expires_in - 60) * 1000
    };
    localStorage.setItem(SP_TOKEN_KEY, JSON.stringify(spToken));
    return spToken.access;
  }

  async function spAccessToken() {
    if (!spToken) return null;
    if (Date.now() < spToken.expiresAt) return spToken.access;
    return await spRefresh();
  }

  let spBackoffUntil = 0;

  async function spApi(path) {
    if (Date.now() < spBackoffUntil) return null;
    const token = await spAccessToken();
    if (!token) return null;
    const url = `https://api.spotify.com/v1${path}`;
    let res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.status === 401) {
      const fresh = await spRefresh();
      if (!fresh) return null;
      res = await fetch(url, { headers: { 'Authorization': `Bearer ${fresh}` } });
    }
    if (res.status === 429) {
      const wait = parseInt(res.headers.get('Retry-After') || '5', 10);
      spBackoffUntil = Date.now() + (wait + 1) * 1000;
      return null;
    }
    if (!res.ok) return null;
    return await res.json();
  }

  function trackFromItem(item) {
    const images = (item.album && item.album.images) || [];
    const thumb = images[images.length - 1] || images[0] || null;
    return {
      name: item.name,
      artists: (item.artists || []).map(a => a.name).join(', '),
      album: item.album ? item.album.name : '',
      art: thumb ? thumb.url : ''

  }

  // アーティスト名を絞り込みに使うと精度が上がる。0件ならアーティスト指定なしで引き直す
  async function spSearchTracks(query, artistHint, limit) {
    const q = String(query || '').trim();
    if (!q) return [];
    const lim = String(limit || 8);
    const attempts = artistHint
      ? [`track:"${q}" artist:"${artistHint}"`, q]
      : [q];
    for (const term of attempts) {
      const data = await spApi(`/search?${new URLSearchParams({ q: term, type: 'track', limit: lim })}`);
      const items = (data && data.tracks && data.tracks.items) || [];
      if (items.length) return items.map(trackFromItem);
    }
    return [];
  }

  async function spSearchArtists(query, limit) {
    const q = String(query || '').trim();
    if (!q) return [];
    const data = await spApi(`/search?${new URLSearchParams({ q, type: 'artist', limit: String(limit || 8) })}`);
    const items = (data && data.artists && data.artists.items) || [];
    return items.map(a => {
      const imgs = a.images || [];
      const thumb = imgs[imgs.length - 1] || imgs[0] || null;
      const genres = (a.genres || []).slice(0, 2).join(', ');
      const followers = a.followers && typeof a.followers.total === 'number'
        ? `フォロワー ${a.followers.total.toLocaleString('ja-JP')}人`
        : '';
      return {
        name: a.name,
        art: thumb ? thumb.url : '',
        sub: genres || followers
      };
    });
  }

  const artQueue = [];

  function queueArtLookup(song, artistHint) {
    if (!spToken) return;
    const key = cacheKey(song, artistHint);
    if (trackCache[key] !== undefined || artQueued.has(key)) return;
    artQueued.add(key);
    artQueue.push({ song, artistHint, key });
    if (!artWorking) runArtQueue();
  }

  async function runArtQueue() {
    artWorking = true;
    let found = 0;
    while (artQueue.length) {
      if (!(await spAccessToken())) break;
      const job = artQueue.shift();
      const results = await spSearchTracks(job.song, job.artistHint, 1);
      // 見つからない場合もnullを入れて、毎回引き直さないようにする
      trackCache[job.key] = results[0] || null;
      if (results[0]) found++;
      if (Date.now() < spBackoffUntil) break;
    }
    artWorking = false;
    persistTrackCache();
    if (found) {
      renderLives();
      if (tabSongs.style.display !== 'none') renderSongs();

      ? 'トークンの文字列が違うか、有効期限が切れています'
      : 'トークンにこのリポジトリのContents権限がありません';
    return `認証エラー(${res.status})：${hint}${detail ? `／GitHubの応答: ${detail}` : ''}`;
  }

  async function loadFromGithub() {
    if (!githubConfig) return;
    setStatus('syncing');
    try {
      const res = await fetch(await ghContentsUrl(), {
        headers: {
          'Authorization': `Bearer ${githubConfig.token}`,
          'Accept': 'application/vnd.github+json'
        }
      });
      if (res.status === 404) {
        remoteSha = null;
        setStatus('synced');
        return;
      }
      if (res.status === 401 || res.status === 403) throw new Error(await ghAuthErrorMessage(res));
      if (!res.ok) throw new Error(`GitHubエラー(${res.status})`);
      const data = await res.json();
      remoteSha = data.sha;
      const decoded = b64DecodeUnicode(data.content || '');
      concerts = decoded ? JSON.parse(decoded) : [];
      saveLocalCache(concerts);
      setStatus('synced');
    } catch (e) {
      setStatus('error', e.message);
    }
  }

  async function saveToGithub() {
    saveLocalCache(concerts);
    if (!githubConfig) { setStatus('unconfigured'); return; }
    setStatus('syncing');
    try {
      const body = {
        message: `update setlist data`,
        content: b64EncodeUnicode(JSON.stringify(concerts, null, 2))
      };
      if (remoteSha) body.sha = remoteSha;
      const res = await fetch(await ghContentsUrl(), {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${githubConfig.token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      if (res.status === 409) {
        alert('他の端末で更新されたデータと衝突しました。最新のデータを取得し直しますので、もう一度操作をやり直してください。');
        await loadFromGithub();
        renderLives();
        return;
      }
      if (res.status === 401 || res.status === 403) throw new Error(await ghAuthErrorMessage(res));
      if (!res.ok) throw new Error(`GitHubエラー(${res.status})`);
      const data = await res.json();
      remoteSha = data.content.sha;
      setStatus('synced');
    } catch (e) {
      setStatus('error', e.message);
    }
  }

  syncNowBtn.addEventListener('click', async () => {
    if (!githubConfig) {

      return;
    }
    await loadFromGithub();
    renderLives();
    if (tabSongs.style.display !== 'none') renderSongs();
  });

  tabButtons.forEach(btn => {

      btn.classList.add('active');

      tabSongs.style.display = tab === 'songs' ? '' : 'none';

  searchInput.addEventListener('input', () => {
    searchTerm = searchInput.value.trim();

  filterPref.addEventListener('change', renderLives);
  filterYear.addEventListener('change', renderLives);
  filterClear.addEventListener('click', () => {
    searchInput.value = '';

  // 絞り込みの選択肢は、実際に登録されている都道府県と年だけを出す
  function refreshFilterOptions() {
    const prefs = Array.from(new Set(concerts.map(c => c.pref).filter(Boolean)))
      .sort((a, b) => PREFS.indexOf(a) - PREFS.indexOf(b));
    const years = Array.from(new Set(concerts.map(c => String(c.date || '').slice(0, 4)).filter(Boolean)))
      .sort((a, b) => b.localeCompare(a));

    const rebuild = (select, values, allLabel) => {
      const keep = select.value;
      select.innerHTML = `<option value="">${allLabel}</option>` +
        values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
      // 選択中の値がまだ存在すれば維持する
      select.value = values.includes(keep) ? keep : '';
    };

    rebuild(filterPref, prefs, 'すべての都道府県');
    rebuild(filterYear, years, 'すべての年');
    filterPref.disabled = prefs.length === 0;
    filterYear.disabled = years.length === 0;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function formatDate(d) {
    if (!d) return '';
    const parts = d.split('-');
    if (parts.length !== 3) return d;
    return `${parts[0]}年${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日`;
  }

  function renderLives() {
    refreshFilterOptions();
    const term = searchTerm.toLowerCase();
    const prefSel = filterPref.value;
    const yearSel = filterYear.value;
    const hasFilter = Boolean(term || prefSel || yearSel);

    const filtered = concerts
      .filter(c => {
        // 文字列検索はアーティスト・会場・日付をまとめて対象にする（「2026-05」で月指定もできる）
        if (term) {
          const hay = `${c.artist || ''} ${c.title || ''} ${c.venue || ''} ${c.pref || ''} ${c.date || ''}`.toLowerCase();
          if (!hay.includes(term)) return false;
        }
        if (prefSel && (c.pref || '') !== prefSel) return false;
        if (yearSel && String(c.date || '').slice(0, 4) !== yearSel) return false;
        return true;
      })
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    filterCount.textContent = hasFilter
      ? `${filtered.length}件 / 全${concerts.length}件`
      : (concerts.length ? `全${concerts.length}件` : '');

    if (filtered.length === 0) {
      livesList.innerHTML = `<div class="empty">${concerts.length === 0
        ? '右下の＋ボタンから、行ったライブを追加してみましょう。'
        : '該当するライブがありません。'}</div>`;
      return;
    }

    livesList.innerHTML = filtered.map(c => {
      const isOpen = openCardId === c.id;
      const songs = c.songs || [];
      return `
        <div class="card ${isOpen ? 'open' : ''}" data-id="${c.id}">
          <div class="card-head" data-action="toggle">
            <div class="info">
              <div class="card-artist">${escapeHtml(c.artist)}</div>
              <div class="card-meta">${formatDate(c.date)}${c.venue ? ' ・ ' + escapeHtml(c.venue) : ''}${songs.length ? ' ・ ' + songs.length + '曲' : ''}${c.pref && !String(c.venue || '').includes(c.pref)
                ? `<span class="card-pref">${escapeHtml(c.pref)}</span>`
                : ''}</div>
            </div>
            <div class="chevron">▶</div>
          </div>
          <div class="card-body">
            ${c.title ? `<div class="card-title">${escapeHtml(c.title)}</div>` : ''}
            ${c.url ? `<a class="ref-link" href="${escapeHtml(c.url)}" target="_blank" rel="noopener">参考リンクを開く</a><br>` : ''}
            ${songs.length
              ? `<ol class="song-list">${songs.map((s, i) => {
                  const art = artFor(s, c.artist);
                  if (!art) queueArtLookup(s, c.artist);
                  return `<li><span class="num">${i + 1}</span>${art
                    ? `<img class="art" src="${escapeHtml(art)}" alt="" loading="lazy">`
                    : '<span class="art"></span>'}<span class="nm">${escapeHtml(s)}</span></li>`;
                }).join('')}</ol>`
              : '<div class="field-hint">セトリ未登録</div>'}
            <div class="card-actions">
              <button class="link-btn" data-action="edit">編集</button>
              <button class="link-btn muted" data-action="delete">削除</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  livesList.addEventListener('click', async (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    const id = card.dataset.id;
    const action = e.target.dataset.action;
    if (action === 'toggle') {
      openCardId = openCardId === id ? null : id;
      renderLives();
    } else if (action === 'edit') {
      openEditModal(id);
    } else if (action === 'delete') {
      if (confirm('このライブを削除しますか？')) {
        concerts = concerts.filter(c => c.id !== id);
        renderLives();
        await saveToGithub();
      }
    }
  });

  function renderSongs() {
    const map = new Map();
    concerts.forEach(c => {
      (c.songs || []).forEach(song => {
        const key = song.trim();
        if (!key) return;
        if (!map.has(key)) map.set(key, []);
        map.get(key).push({ artist: c.artist, date: c.date, venue: c.venue });
      });
    });

    const entries = Array.from(map.entries()).sort((a, b) => {
      if (b[1].length !== a[1].length) return b[1].length - a[1].length;
      return a[0].localeCompare(b[0], 'ja');
    });

    if (entries.length === 0) {
      songsList.innerHTML = '<div class="empty">ライブを登録すると、聴いた曲がここに一覧表示されます。</div>';
      return;
    }

    songsList.innerHTML = entries.map(([song, occurrences]) => {
      const isOpen = openSongKey === song;
      const hint = occurrences[0] ? occurrences[0].artist : '';
      const art = artFor(song, hint);
      if (!art) queueArtLookup(song, hint);
      return `
        <div class="song-row ${isOpen ? 'open' : ''}" data-song="${escapeHtml(song)}">
          <div class="song-row-head" data-action="toggle">
            ${art
              ? `<img class="art" src="${escapeHtml(art)}" alt="" loading="lazy">`
              : '<span class="art"></span>'}
            <div class="song-name">${escapeHtml(song)}</div>
            <div class="song-count-badge">${occurrences.length}</div>
          </div>
          <div class="song-detail">
            ${occurrences
              .slice()
              .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
              .map(o => `<div>${formatDate(o.date)} ・ ${escapeHtml(o.artist)}${o.venue ? ' ・ ' + escapeHtml(o.venue) : ''}</div>`)
              .join('')}
          </div>
        </div>`;
    }).join('');
  }

  songsList.addEventListener('click', (e) => {

    PREFS.map(p => `<option value="${p}">${p}</option>`).join('');

        </button>`).join('');

  spArtistResults.addEventListener('click', (e) => {

    fArtist.value = a.name;

  // --- 公演を検索して自動入力 ---
  const slFetchBtn = document.getElementById('slFetchBtn');
  const slResults = document.getElementById('slResults');
  const slNote = document.getElementById('slNote');
  let slLast = [];

  function clearSlResults() {
    slResults.innerHTML = '';
    slResults.classList.remove('show');
    slLast = [];
  }

  slFetchBtn.addEventListener('click', async () => {
    clearSlResults();
    if (!SETLIST_PROXY) {
      slNote.textContent = '公演検索は未設定です（中継サーバーのURLが入っていません）。';
      return;
    }
    if (!fDate.value) {
      slNote.textContent = 'まず日付を入れてください。';
      return;
    }
    slFetchBtn.disabled = true;
    slNote.textContent = '検索中...';
    try {
      const { entries, matchedCount, total } = await searchSetlistsByDate(fDate.value, fPref.value, msg => {
        slNote.textContent = msg;
      });
      if (!entries.length) {
        slNote.textContent = 'この日の公演は見つかりませんでした。手入力で登録してください。';
        return;
      }
      // 一覧が長くなりすぎないよう表示は絞る（一致した都道府県が先頭に並んでいる）
      const shown = entries.slice(0, 25);
      slLast = shown;
      slResults.innerHTML = shown.map((e, i) => {
        const place = [e.venue, e.city].filter(Boolean).join('・');
        const extra = [e.tour, e.songs.length ? `${e.songs.length}曲` : ''].filter(Boolean).join(' / ');
        return `
          <button type="button" class="sp-result" data-i="${i}">
            <span class="t">
              <b>${escapeHtml(e.artist)}</b>
              <span>${escapeHtml(place)}${extra ? ' ・ ' + escapeHtml(extra) : ''}</span>
            </span>
          </button>`;
      }).join('');
      slResults.classList.add('show');
      const parts = [`この日は全${total}件`];
      if (fPref.value) {
        parts.push(matchedCount
          ? `うち${fPref.value}が${matchedCount}件（先頭に表示）`
          : `${fPref.value}は見つからず、他の地域を表示`);
      }
      if (shown.length < entries.length) parts.push(`${shown.length}件まで表示`);
      slNote.innerHTML = `${escapeHtml(parts.join(' / '))}<br>情報提供: <a href="https://www.setlist.fm/" target="_blank" rel="noopener">setlist.fm</a>`;
    } catch (e) {
      slNote.textContent = e.message;
    } finally {
      slFetchBtn.disabled = false;
    }
  });

  slResults.addEventListener('click', (e) => {
    const btn = e.target.closest('.sp-result');
    if (!btn) return;
    const picked = slLast[Number(btn.dataset.i)];
    if (!picked) return;
    fArtist.value = picked.artist;
    if (picked.tour) fTitle.value = picked.tour;
    if (picked.venue) fVenue.value = picked.venue;
    const prefJa = EN_TO_PREF[normLatin(picked.state)];
    if (prefJa) {
      fPref.value = prefJa;
      prefTouched = true; // 自動入力後に会場名で上書きされないようにする
    }
    if (picked.songs.length) fSongs.value = picked.songs.join('\n') + '\n';
    if (!fUrl.value && picked.url) fUrl.value = picked.url;
    clearSlResults();
    slNote.textContent = `「${picked.artist}」の内容を入力しました。必要なら直してください。`;
  });

  function clearSpResults() {
    spResults.innerHTML = '';
    spResults.classList.remove('show');
    spLastResults = [];
  }

  function resetSpotifySearch() {
    clearTimeout(spSearchTimer);
    clearTimeout(spArtistTimer);
    spQuery.value = '';
    clearSpResults();
    clearArtistResults();
    clearSlResults();
    slNote.textContent = '';
    spArtistNote.textContent = '';
    spNote.textContent = spToken ? '' : SP_NOT_CONNECTED;
  }

  spQuery.addEventListener('input', () => {
    clearTimeout(spSearchTimer);
    const q = spQuery.value.trim();
    if (!q) {
      clearSpResults();
      spNote.textContent = spToken ? '' : SP_NOT_CONNECTED;
      return;
    }
    if (!spToken) {
      spNote.textContent = SP_NOT_CONNECTED;
      return;
    }
    // 1文字ごとに叩かないよう、入力が止まってから検索する
    spSearchTimer = setTimeout(async () => {
      spNote.textContent = '検索中...';
      const results = await spSearchTracks(q, fArtist.value.trim(), 8);
      if (spQuery.value.trim() !== q) return; // 入力が変わっていたら破棄
      if (!results.length) {
        clearSpResults();
        spNote.textContent = '見つかりませんでした。下の欄に手入力でも登録できます。';
        return;
      }
      spLastResults = results;
      spNote.textContent = '';
      spResults.innerHTML = results.map((t, i) => `
        <button type="button" class="sp-result" data-i="${i}">
          ${t.art ? `<img src="${escapeHtml(t.art)}" alt="">` : '<span class="art"></span>'}
          <span class="t"><b>${escapeHtml(t.name)}</b><span>${escapeHtml(t.artists)}</span></span>
        </button>`).join('');
      spResults.classList.add('show');
    }, 350);
  });

  spResults.addEventListener('click', (e) => {
    const btn = e.target.closest('.sp-result');
    if (!btn) return;
    const t = spLastResults[Number(btn.dataset.i)];
    if (!t) return;
    const lines = fSongs.value.split('\n').map(s => s.trim()).filter(Boolean);
    lines.push(t.name);
    fSongs.value = lines.join('\n') + '\n';
    fSongs.scrollTop = fSongs.scrollHeight;
    // 選んだ曲の情報をキャッシュしておけば、あとで検索し直さずアートが出る
    trackCache[cacheKey(t.name, fArtist.value.trim())] = t;
    persistTrackCache();
    spQuery.value = '';
    clearSpResults();
    spNote.textContent = `「${t.name}」を追加しました。`;
  });

  function openAddModal() {
    modalTitle.textContent = 'ライブを追加';
    editIdInput.value = '';
    liveForm.reset();
    fPref.value = '';
    prefTouched = false;
    fPrefHint.textContent = PREF_HINT_DEFAULT;
    resetSpotifySearch();
    modalOverlay.classList.add('show');
  }

  function openEditModal(id) {
    const c = concerts.find(c => c.id === id);
    if (!c) return;
    modalTitle.textContent = 'ライブを編集';
    editIdInput.value = c.id;
    fArtist.value = c.artist || '';
    fTitle.value = c.title || '';
    fDate.value = c.date || '';
    fVenue.value = c.venue || '';
    // 既に都道府県が入っているなら、会場名の再入力で勝手に書き換えない
    fPref.value = c.pref && PREFS.includes(c.pref) ? c.pref : '';
    prefTouched = Boolean(fPref.value);
    fPrefHint.textContent = PREF_HINT_DEFAULT;
    fUrl.value = c.url || '';
    fSongs.value = (c.songs || []).join('\n');
    resetSpotifySearch();
    modalOverlay.classList.add('show');
  }

  function closeModal() {
    modalOverlay.classList.remove('show');
    resetSpotifySearch();
  }

  document.getElementById('addFab').addEventListener('click', openAddModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  liveForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = editIdInput.value || String(Date.now());
    const songs = fSongs.value.split('\n').map(s => s.trim()).filter(Boolean);
    const venue = fVenue.value.trim();
    const data = {
      id,
      artist: fArtist.value.trim(),
      title: fTitle.value.trim(),
      date: fDate.value,
      venue,
      // 未選択のまま保存された場合も、会場名から推定できれば入れておく
      pref: fPref.value || guessPref(venue),
      url: fUrl.value.trim(),
      songs
    };
    const idx = concerts.findIndex(c => c.id === id);
    if (idx >= 0) {
      concerts[idx] = data;
    } else {
      concerts.push(data);
    }
    closeModal();
    renderLives();
    saveBtn.disabled = true;
    await saveToGithub();

  // Settings modal handling
  const settingsOverlay = document.getElementById('settingsOverlay');
  const settingsError = document.getElementById('settingsError');
  const ghOwner = document.getElementById('ghOwner');
  const ghRepo = document.getElementById('ghRepo');
  const ghToken = document.getElementById('ghToken');
  const settingsSaveBtn = document.getElementById('settingsSaveBtn');
  const spState = document.getElementById('spState');
  const spConnectBtn = document.getElementById('spConnectBtn');
  const spDisconnectBtn = document.getElementById('spDisconnectBtn');

  function updateSpotifyUi() {

    });
  });

  spDisconnectBtn.addEventListener('click', () => {
    spToken = null;
    localStorage.removeItem(SP_TOKEN_KEY);
    updateSpotifyUi();
  });

  function openSettingsModal() {
    settingsError.classList.remove('show');
    updateSpotifyUi();
    if (githubConfig) {
      ghOwner.value = githubConfig.owner || '';
      ghRepo.value = githubConfig.repo || '';
      ghToken.value = githubConfig.token || '';
    } else {
      ghOwner.value = '';
      ghRepo.value = '';
      ghToken.value = '';
    }
    settingsOverlay.classList.add('show');
  }

  document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
  document.getElementById('settingsCancelBtn').addEventListener('click', () => {
    settingsOverlay.classList.remove('show');
  });
  settingsOverlay.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) settingsOverlay.classList.remove('show');
  });

  settingsSaveBtn.addEventListener('click', async () => {
    const owner = ghOwner.value.trim();
    const repo = ghRepo.value.trim();
    const token = ghToken.value.trim();
    if (!owner || !repo || !token) {
      settingsError.textContent = 'すべての項目を入力してください。';
      settingsError.classList.add('show');
      return;
    }
    settingsSaveBtn.disabled = true;
    settingsSaveBtn.textContent = '接続確認中...';
    const previousConfig = githubConfig;
    githubConfig = { owner, repo, token };
    try {
      const res = await fetch(await ghContentsUrl(), {
        headers: {
          'Authorization': `Bearer ${githubConfig.token}`,
          'Accept': 'application/vnd.github+json'
        }
      });
      if (res.status === 401 || res.status === 403) throw new Error(await ghAuthErrorMessage(res));
      if (res.status === 404) {
        // repo reachable, file not yet created — fine
      } else if (!res.ok) {
        throw new Error(`接続できませんでした(${res.status})：ユーザー名・リポジトリ名を確認してください`);
      } else {
        const data = await res.json();
        remoteSha = data.sha;
        const decoded = b64DecodeUnicode(data.content || '');
        concerts = decoded ? JSON.parse(decoded) : [];
      }
      saveGithubConfig(githubConfig);
      saveLocalCache(concerts);
      settingsOverlay.classList.remove('show');
      setStatus('synced');
      renderLives();
      if (tabSongs.style.display !== 'none') renderSongs();
    } catch (e) {
      githubConfig = previousConfig;
      settingsError.textContent = e.message;
      settingsError.classList.add('show');
    } finally {
      settingsSaveBtn.disabled = false;
      settingsSaveBtn.textContent = '保存して接続確認';
    }
  });

  // Export / Import
  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(concerts, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const today = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `setlist-backup-${today}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  const importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', () => {
    const file = importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const imported = JSON.parse(reader.result);
        if (!Array.isArray(imported)) throw new Error('invalid format');
        if (confirm(`${imported.length}件のライブを読み込みます。現在のデータと統合しますか？`)) {
          const existingIds = new Set(concerts.map(c => c.id));
          imported.forEach(c => {
            if (existingIds.has(c.id)) {
              c.id = String(Date.now()) + Math.random().toString(36).slice(2, 7);
            }
            concerts.push(c);
          });
          renderLives();
          await saveToGithub();
        }
      } catch (err) {
        alert('読み込みに失敗しました。正しいバックアップファイルか確認してください。');
      }
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  // Spotifyの認証画面から戻ってきたときの処理
  async function handleSpotifyRedirect() {
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const error = params.get('error');
    if (!code && !error) return;
    // 認証コードをアドレスバーに残さない
    history.replaceState({}, '', spRedirectUri());
    if (error) {
      alert(`Spotify連携が完了しませんでした: ${error}`);
      return;
    }
    try {
      await spExchangeCode(code);
      artQueued.clear(); // 未接続で諦めた分を引き直せるようにする
    } catch (e) {
      alert(`Spotify連携に失敗しました: ${e.message}`);
    }
  }

  (async function init() {
    await handleSpotifyRedirect();
    updateSpotifyUi();
    setStatus();
    renderLives();
    if (githubConfig) {
      await loadFromGithub();
      renderLives();
    }
  })();
})();
</script>

</body>
</html>
